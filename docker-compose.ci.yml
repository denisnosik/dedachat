services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messenger"]
      interval: 2s
      timeout: 2s
      retries: 15

  server:
    build: .
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    environment:
      - DB_URL=postgres://postgres:postgres@db:5432/messenger?sslmode=disable
      - SECRET=test-secret
      - GOOSE_DRIVER=postgres
      - GOOSE_DBSTRING=postgres://postgres:postgres@db:5432/messenger?sslmode=disable
      - GOOSE_MIGRATION_DIR=sql/schema
      # The suite registers dozens of users from one IP within seconds, which
      # is exactly what the production default is meant to stop. The API tier
      # keeps its defaults: it is keyed per user, and no test comes close.
      - RATE_LIMIT_AUTH_PER_MIN=6000
      - RATE_LIMIT_AUTH_BURST=200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
